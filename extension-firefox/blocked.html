<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StayLocked — Focus Mode</title><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="brand"><img src="icons/icon-128.png" alt="">StayLocked</div>
<div class="tag">MAKE ROOM FOR WHAT MATTERS</div>
<h1 id="heading">FOCUS MODE</h1>
<p><strong id="domain">This website</strong> <span id="description">is blocked during your focus session.</span></p>
<div class="timer" id="timer" role="timer">Checking session…</div>
<p id="instruction">Wait for the timer or restart your PC to end Focus Mode.</p>
<p class="note error" id="connection" role="status"></p>
<button id="open" disabled>Open website</button>
<p class="note motto">Easy to enter. Annoying to leave. Never impossible to leave.</p>
</main><script src="blocked.js"></script></body></html>
